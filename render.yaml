services:
  - type: web
    name: tubetone
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DOWNLOAD_DIR
        value: /tmp/tubetone
      - key: PYTHONUNBUFFERED
        value: "1"
      # Keep 0 on free tier — Node POT provider causes OOM kills
      - key: ENABLE_BGUTIL
        value: "0"
